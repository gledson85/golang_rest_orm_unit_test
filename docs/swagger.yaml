basePath: /
definitions:
  controllers.ResponseError:
    properties:
      error:
        example: User not found
        type: string
    type: object
  controllers.ResponseMessage:
    properties:
      message:
        example: User deleted
        type: string
    type: object
  models.User:
    properties:
      email:
        example: john@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: John Doe
        type: string
    type: object
host: localhost:8081
info:
  contact:
    name: API Support
    url: https://github.com/gleds/golang_rest_orm_unit_test
  description: REST API for user management with CRUD operations.
  license:
    name: MIT
  title: User API
  version: "1.0"
paths:
  /users:
    get:
      description: Returns a list of all registered users. Returns an empty array
        if no users exist.
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/controllers.ResponseError'
      summary: List all users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new user in the database. The ID field is auto-generated
        and should not be provided in the request body.
      parameters:
      - description: User payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/controllers.ResponseError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/controllers.ResponseError'
      summary: Create a new user
      tags:
      - users
  /users/{id}:
    delete:
      description: Permanently removes a user from the database. The user must exist
        or a 404 is returned.
      parameters:
      - description: User ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            $ref: '#/definitions/controllers.ResponseMessage'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/controllers.ResponseError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/controllers.ResponseError'
      summary: Delete a user by ID
      tags:
      - users
    get:
      description: Returns a single user matching the given ID.
      parameters:
      - description: User ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User found
          schema:
            $ref: '#/definitions/models.User'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/controllers.ResponseError'
      summary: Get a user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates the name and/or email of an existing user. The user must
        exist or a 404 is returned.
      parameters:
      - description: User ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Updated user payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/controllers.ResponseError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/controllers.ResponseError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/controllers.ResponseError'
      summary: Update a user by ID
      tags:
      - users
schemes:
- http
swagger: "2.0"
